<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMBERWARDEN — Keeper of the Last Lantern</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05060f; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { display: block; touch-action: none; cursor: crosshair; image-rendering: auto; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="EMBERWARDEN: defend the beacon. Move with WASD, aim with the mouse, hold click to fire embers, Shift to dash, E for a flare."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
